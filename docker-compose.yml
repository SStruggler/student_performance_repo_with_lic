version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-perf-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/model:/app/model
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-perf-ui
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://backend:8001
    depends_on:
      - backend
    restart: unless-stopped
